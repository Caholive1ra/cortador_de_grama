<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Assistente de Decupagem</title>
    <style>
      html, body { margin:0; padding:0; width:100%; height:100%; background:#151515; color:#e8e8e8; font-family:Arial,sans-serif; }
      body { overflow-y:auto; overflow-x:hidden; }
      .painel { padding:18px; }
      .cabecalho { position:relative; display:flex; align-items:center; gap:14px; min-height:96px; margin:-18px -18px 18px; padding:18px; text-align:left; background:linear-gradient(135deg,#252525 0%,#191919 62%,#301326 100%); border-bottom:1px solid #3d3d3d; overflow:hidden; }
      .cabecalho::after { content:""; position:absolute; right:-36px; top:-48px; width:150px; height:150px; border:26px solid rgba(237,20,91,.25); border-radius:50%; }
      .logo { position:relative; z-index:1; flex:0 0 82px; width:82px; max-height:34px; object-fit:contain; object-position:left center; }
      .cabecalho-texto { position:relative; z-index:1; min-width:0; }
      h1 { margin:0 0 5px; font-size:19px; line-height:1.15; letter-spacing:.2px; }
      .subtitulo { margin:0; color:#c4c4c4; font-size:12px; line-height:1.35; }
      .bloco { margin-bottom:14px; padding:14px; background:#2a2a2a; border:1px solid #444; border-radius:8px; }
      h2 { margin:0 0 8px; font-size:16px; }
      p { font-size:13px; line-height:1.4; }
      select, input[type="button"], button { display:block; width:100%; min-height:42px; margin-top:10px; padding:9px; border-radius:6px; border:1px solid #555; font-size:14px; font-weight:bold; }
      select { color:#eee; background:#1e1e1e; }
      input[type="button"], button { color:white; background:#3d8bfd; cursor:pointer; }
      input[type="button"]:hover, button:hover { background:#5aa0ff; }
      #btnLettering { background:#7954d8; }
      #statusText { padding:10px; color:#bbb; background:#2a2a2a; border-radius:6px; }
    </style>
  </head>
  <body>
    <main class="painel">
      <header class="cabecalho">
        <img class="logo" src="assets/fiap_branco.png" alt="FIAP" />
        <div class="cabecalho-texto">
          <h1>Assistente de Decupagem</h1>
          <p class="subtitulo">Pré-edição e apoio pedagógico por IA</p>
        </div>
      </header>
      <section class="bloco">
        <h2>Cortar aula</h2>
        <p>Selecione as fontes e gere a primeira sequência de cortes.</p>
        <select id="projectType" aria-label="Tipo de projeto">
          <option value="videoaula">Vídeo-aula</option>
          <option value="videocast">Videocast</option>
        </select>
        <button id="btnProcessar" type="button">Selecionar fontes e processar</button>
      </section>
      <section class="bloco">
        <h2>Indicar letterings</h2>
        <p>Indique a sequência revisada pelo humano para encontrar os pontos que precisam de texto.</p>
        <button id="btnLettering" type="button">Selecionar sequência e indicar letterings</button>
      </section>
      <p id="statusText">Aguardando...</p>
    </main>
    <script src="main.js"></script>
  </body>
</html>
